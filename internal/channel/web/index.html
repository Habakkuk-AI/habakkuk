<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Habakkuk</title>
<meta name="theme-color" content="#F4F1EA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1116" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128'%3E%3Crect width='128' height='128' rx='28' fill='%230E1116'/%3E%3Cg transform='translate(9 11) scale(0.8594)'%3E%3Cg fill='%23F4F1EA'%3E%3Cpath d='M26 108 V50 A15 15 0 0 1 56 50 V108 a4 4 0 0 1 -4 4 H30 a4 4 0 0 1 -4 -4 Z'/%3E%3Cpath d='M72 108 V50 A15 15 0 0 1 102 50 V108 a4 4 0 0 1 -4 4 H76 a4 4 0 0 1 -4 -4 Z'/%3E%3Crect x='54' y='70' width='20' height='14'/%3E%3C/g%3E%3Ccircle cx='64' cy='24' r='9' fill='%23FFB020'/%3E%3C/g%3E%3C/svg%3E">
<style>
:root {
  --bg: #F4F1EA; --panel: #FBFAF6; --text: #0E1116; --muted: #67645C; --line: #E2DDD1;
  --accent: #0E1116; --accent-text: #F4F1EA; --mine: #0E1116; --mine-text: #F4F1EA; --theirs: #FBFAF6; --code: #EEEAE0;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0E1116; --panel: #151A21; --text: #F4F1EA; --muted: #9C9A93; --line: #262C35;
    --accent: #F4F1EA; --accent-text: #0E1116; --mine: #F4F1EA; --mine-text: #0E1116; --theirs: #151A21; --code: #1A2028;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.app { display: flex; height: 100%; height: 100dvh; }
aside { width: 260px; flex: none; background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; }
aside .top { padding: 12px; display: flex; gap: 8px; }
aside .top button { flex: 1; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
aside select { width: calc(100% - 24px); margin: 0 12px 8px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
#convs { list-style: none; margin: 0; padding: 0 8px; overflow-y: auto; flex: 1; }
#convs li { padding: 8px 10px; border-radius: 8px; cursor: pointer; display: flex; gap: 6px; align-items: center; }
#convs li span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#convs li small { color: var(--muted); }
#convs li.on { background: var(--bg); font-weight: 600; }
#convs li button { border: 0; background: none; color: var(--muted); padding: 0 4px; visibility: hidden; }
#convs li:hover button, #convs li.on button { visibility: visible; }
aside .foot { padding: 10px 12px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); display: flex; justify-content: space-between; }
aside .foot button { border: 0; background: none; color: var(--accent); padding: 0; }
main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
header { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--panel); }
header h1 { font-size: 16px; margin: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#menu { display: none; border: 0; background: none; font-size: 20px; padding: 0 4px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: #D0503F; flex: none; }
.dot.on { background: #2E9A60; }
#log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.msg { max-width: min(760px, 88%); padding: 9px 13px; border-radius: 14px; overflow-wrap: anywhere; }
.msg.user { align-self: flex-end; background: var(--mine); color: var(--mine-text); border-bottom-right-radius: 4px; white-space: pre-wrap; }
.msg.assistant { align-self: flex-start; background: var(--theirs); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
.msg pre { background: var(--code); padding: 8px 10px; border-radius: 8px; overflow-x: auto; margin: 6px 0; white-space: pre; }
.msg code { background: var(--code); padding: 1px 4px; border-radius: 4px; font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; }
.msg pre code { padding: 0; background: none; }
.msg a { color: var(--accent); }
.msg.user a { color: inherit; }
.empty { margin: auto; color: var(--muted); text-align: center; }
#typing { color: var(--muted); font-size: 13px; padding: 0 18px 6px; min-height: 1.5em; }
form { display: flex; gap: 8px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: var(--panel); }
textarea { flex: 1; resize: none; border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; background: var(--bg); max-height: 40vh; }
form button { border: 0; border-radius: 10px; padding: 0 16px; background: var(--accent); color: var(--accent-text); }
#gate { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: center; justify-content: center; padding: 16px; }
#gate.show { display: flex; }
#gate div { background: var(--panel); border-radius: 12px; padding: 20px; width: 100%; max-width: 380px; }
#gate h2 { margin: 0 0 6px; font-size: 17px; }
#gate p { margin: 0 0 12px; color: var(--muted); font-size: 14px; }
#gate input { width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); margin-bottom: 10px; }
#gate button { width: 100%; padding: 9px; border: 0; border-radius: 8px; background: var(--accent); color: var(--accent-text); }
@media (max-width: 720px) {
  aside { position: fixed; inset: 0 auto 0 0; z-index: 5; transform: translateX(-100%); transition: transform .2s; box-shadow: 0 0 24px rgba(0,0,0,.25); }
  aside.open { transform: none; }
  #menu { display: block; }
  .msg { max-width: 92%; }
}
</style>
</head>
<body>
<div class="app">
  <aside id="side">
    <div class="top"><button id="new" type="button">New chat</button></div>
    <select id="agent" title="Agent for new chats" hidden></select>
    <ul id="convs"></ul>
    <div class="foot"><span>Habakkuk</span><button id="tokenBtn" type="button">Token</button></div>
  </aside>
  <main>
    <header><button id="menu" type="button" aria-label="Conversations">&#9776;</button><h1 id="title">Habakkuk</h1><span id="dot" class="dot" title="offline"></span></header>
    <div id="log"></div>
    <div id="typing"></div>
    <form id="form"><textarea id="box" rows="1" placeholder="Message Habakkuk" autocomplete="off"></textarea><button type="submit">Send</button></form>
  </main>
</div>
<div id="gate"><div>
  <h2>Access token</h2>
  <p>Enter the token from the variable named by <code>http.token_env</code>. It is kept in this browser.</p>
  <input id="tok" type="password" autocomplete="off" placeholder="token">
  <button id="tokSave" type="button">Save</button>
</div></div>
<script>
"use strict";
const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem("habakkuk." + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("habakkuk." + k, JSON.stringify(v)); } catch {} },
};
let token = store.get("token", "");
let convs = store.get("convs", []);
let current = store.get("current", "");
let lastSeq = 0, gen = 0, ctrl = null, typingTimer = 0;

function rid() {
  const b = new Uint8Array(8);
  crypto.getRandomValues(b);
  return Array.from(b, x => x.toString(16).padStart(2, "0")).join("");
}
function headers(json) {
  const h = {};
  if (token) h.Authorization = "Bearer " + token;
  if (json) h["Content-Type"] = "application/json";
  return h;
}
function esc(s) {
  return s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
}
// Basic Markdown: fenced code, inline code, bold, links. Everything is
// escaped first, so model output can never inject markup.
function md(src) {
  return src.split("```").map((part, i) => {
    if (i % 2) {
      const nl = part.indexOf("\n");
      const code = nl >= 0 && /^[\w+#.-]*$/.test(part.slice(0, nl)) ? part.slice(nl + 1) : part;
      return "<pre><code>" + esc(code.replace(/\n$/, "")) + "</code></pre>";
    }
    return inline(part);
  }).join("");
}
function inline(t) {
  const codes = [];
  t = esc(t).replace(/`([^`\n]+)`/g, (_, c) => "\u0000" + (codes.push(c) - 1) + "\u0000");
  t = t.replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
  t = t.replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  t = t.replace(/(^|[\s(])(https?:\/\/[^\s<]*[^\s<.,;:!?)])/g, '$1<a href="$2" target="_blank" rel="noopener noreferrer">$2</a>');
  t = t.replace(/\u0000(\d+)\u0000/g, (_, i) => "<code>" + codes[i] + "</code>");
  return t.replace(/\n/g, "<br>");
}

function conv() { return convs.find(c => c.id === current); }
function save() { store.set("convs", convs); store.set("current", current); }
function newConv() {
  const c = { id: "c-" + rid(), title: "New chat", agent: $("agent").value || "", updated: Date.now() };
  convs.unshift(c);
  open(c.id);
}
function renderList() {
  const ul = $("convs");
  ul.textContent = "";
  for (const c of convs) {
    const li = document.createElement("li");
    li.className = c.id === current ? "on" : "";
    const span = document.createElement("span");
    span.textContent = c.title;
    li.append(span);
    if (c.agent) { const s = document.createElement("small"); s.textContent = c.agent; li.append(s); }
    const del = document.createElement("button");
    del.type = "button"; del.textContent = "×"; del.title = "Remove from this list";
    del.onclick = e => {
      e.stopPropagation();
      convs = convs.filter(x => x.id !== c.id);
      if (current === c.id) { current = convs[0] ? convs[0].id : ""; if (!current) newConv(); else open(current); }
      save(); renderList();
    };
    li.append(del);
    li.onclick = () => { open(c.id); $("side").classList.remove("open"); };
    ul.append(li);
  }
}
function open(id) {
  current = id;
  save(); renderList();
  const c = conv();
  $("title").textContent = c ? c.title : "Habakkuk";
  $("log").innerHTML = '<div class="empty">Say hello.</div>';
  $("typing").textContent = "";
  lastSeq = 0;
  listen(id);
}
function add(e) {
  if (e.seq <= lastSeq) return;
  lastSeq = e.seq;
  const log = $("log");
  const empty = log.querySelector(".empty");
  if (empty) empty.remove();
  const near = log.scrollHeight - log.scrollTop - log.clientHeight < 80;
  const div = document.createElement("div");
  div.className = "msg " + (e.role === "user" ? "user" : "assistant");
  if (e.role === "user") div.textContent = e.text; else div.innerHTML = md(e.text);
  div.title = new Date(e.at).toLocaleString();
  log.append(div);
  if (near || e.role === "user") log.scrollTop = log.scrollHeight;
  if (e.role !== "user") { $("typing").textContent = ""; clearTimeout(typingTimer); }
}
function online(on) { $("dot").className = "dot" + (on ? " on" : ""); $("dot").title = on ? "connected" : "offline"; }

// Event stream over fetch, so the token can travel in a header.
async function listen(id) {
  const mine = ++gen;
  if (ctrl) ctrl.abort();
  ctrl = new AbortController();
  const signal = ctrl.signal;
  while (mine === gen) {
    try {
      const res = await fetch("api/chat/" + encodeURIComponent(id) + "/events?after=" + lastSeq, { headers: headers(), signal });
      if (res.status === 401) { online(false); gate(); return; }
      if (!res.ok) throw new Error("HTTP " + res.status);
      online(true);
      const reader = res.body.getReader(), dec = new TextDecoder();
      let buf = "";
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        let i;
        while ((i = buf.indexOf("\n\n")) >= 0) {
          const block = buf.slice(0, i);
          buf = buf.slice(i + 2);
          if (mine === gen) handle(block);
        }
      }
    } catch (err) {
      if (mine !== gen) return;
    }
    online(false);
    await new Promise(r => setTimeout(r, 2000));
  }
}
function handle(block) {
  let event = "message", data = "";
  for (const line of block.split("\n")) {
    if (line.startsWith("event:")) event = line.slice(6).trim();
    else if (line.startsWith("data:")) data += line.slice(5).trim();
  }
  if (event === "typing") {
    $("typing").textContent = "Habakkuk is working…";
    clearTimeout(typingTimer);
    typingTimer = setTimeout(() => { $("typing").textContent = ""; }, 7000);
  } else if (event === "message" && data) {
    try { add(JSON.parse(data)); } catch {}
  }
}

async function send(text) {
  const c = conv();
  if (!c) return;
  const body = { conversation: c.id, text, id: "m-" + rid() };
  if (c.agent) body.agent = c.agent;
  try {
    const res = await fetch("api/chat", { method: "POST", headers: headers(true), body: JSON.stringify(body) });
    if (res.status === 401) { gate(); $("box").value = text; return; }
    if (!res.ok) {
      const j = await res.json().catch(() => ({}));
      throw new Error(j.error || "HTTP " + res.status);
    }
  } catch (err) {
    $("box").value = text;
    alert("Not sent: " + err.message);
    return;
  }
  if (c.title === "New chat") { c.title = text.slice(0, 48); $("title").textContent = c.title; }
  c.updated = Date.now();
  convs = [c, ...convs.filter(x => x !== c)];
  save(); renderList();
}

async function loadAgents() {
  try {
    const res = await fetch("api/agents", { headers: headers() });
    if (res.status === 401) { gate(); return false; }
    if (!res.ok) return true;
    const j = await res.json();
    const sel = $("agent");
    sel.textContent = "";
    for (const a of j.agents) {
      const o = document.createElement("option");
      o.value = a; o.textContent = a + (a === j.default ? " (default)" : "");
      o.selected = a === j.default;
      sel.append(o);
    }
    sel.hidden = j.agents.length < 2;
  } catch {}
  return true;
}
function gate() { $("gate").classList.add("show"); $("tok").value = token; $("tok").focus(); }
$("tokSave").onclick = async () => {
  token = $("tok").value.trim();
  store.set("token", token);
  $("gate").classList.remove("show");
  if (await loadAgents()) start();
};
$("tok").onkeydown = e => { if (e.key === "Enter") $("tokSave").click(); };
$("tokenBtn").onclick = gate;
$("new").onclick = () => { newConv(); $("side").classList.remove("open"); $("box").focus(); };
$("menu").onclick = () => $("side").classList.toggle("open");
$("form").onsubmit = e => {
  e.preventDefault();
  const text = $("box").value.trim();
  if (!text) return;
  $("box").value = "";
  grow();
  send(text);
};
const box = $("box");
function grow() { box.style.height = "auto"; box.style.height = Math.min(box.scrollHeight, innerHeight * 0.4) + "px"; }
box.oninput = grow;
box.onkeydown = e => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing && !matchMedia("(pointer: coarse)").matches) {
    e.preventDefault();
    $("form").requestSubmit();
  }
};
function start() {
  if (conv()) open(current);
  else if (convs.length) open(convs[0].id);
  else newConv();
}
loadAgents().then(ok => { if (ok) start(); });
</script>
</body>
</html>
