# A synthetic Codex config for the import tests.
model = "gpt-5.6-sol"
model_provider = "openai"
approval_policy = "on-request"
notify = ["notify-send", "Codex"]

[mcp_servers.docs]
command = "npx"
args = ["-y", "docs-mcp", "--root", "/Users/sam/docs"]
env = { "DOCS_TOKEN" = "fixture-docs-Ab3dE5fG7h" }
startup_timeout_sec = 20

[mcp_servers.tracker]
url = "https://mcp.tracker.example/mcp"
bearer_token_env_var = "TRACKER_TOKEN"

[mcp_servers.parked]
command = "parked-server"
enabled = false

[profiles.fast]
model = "gpt-5.6-luna"

[model_providers.studio]
name = "Studio"
base_url = "https://studio.example.net/v1"
env_key = "STUDIO_KEY"
wire_api = "chat"
