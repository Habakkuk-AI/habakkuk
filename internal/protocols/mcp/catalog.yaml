# Well-known public MCP servers for `habakkuk mcp catalog` and `habakkuk mcp add`.
#
# server is an mcp_servers entry. In env, the key is the variable the server
# reads and the value the variable Habakkuk takes it from (the environment or
# $HABAKKUK_HOME/.env); in headers, a value like "Bearer ${VAR}" does the same.
# {param} placeholders in args or url are filled from `habakkuk mcp add NAME
# param=value`. needs lists programs that must be on PATH. A hosted server
# with auth: oauth signs in through the MCP authorization flow
# (`habakkuk mcp login NAME`); no variables are needed.
#
# Only servers whose package or endpoint is published by the vendor, or by
# the MCP project itself, belong here. Several of the MCP project's
# reference servers are archived but still published; they are marked.

- name: github
  title: GitHub
  description: Repositories, issues, pull requests, Actions and code search (GitHub's own server).
  homepage: https://github.com/github/github-mcp-server
  tags: [code, git, issues]
  needs: [docker]
  server:
    command: docker
    args: [run, -i, --rm, -e, GITHUB_PERSONAL_ACCESS_TOKEN, ghcr.io/github/github-mcp-server]
    env: {GITHUB_PERSONAL_ACCESS_TOKEN: GITHUB_PERSONAL_ACCESS_TOKEN}
    approve: [create_pull_request, merge_pull_request, push_files, create_or_update_file, delete_file]
  notes: Create a fine-grained personal access token limited to the repositories Habakkuk should see.

- name: gitlab
  title: GitLab
  description: Projects, issues, merge requests and files on GitLab (MCP reference server, archived).
  homepage: https://www.npmjs.com/package/@modelcontextprotocol/server-gitlab
  tags: [code, git, issues]
  needs: [npx]
  server:
    command: npx
    args: [-y, "@modelcontextprotocol/server-gitlab"]
    env: {GITLAB_PERSONAL_ACCESS_TOKEN: GITLAB_PERSONAL_ACCESS_TOKEN}
  notes: For a self-managed instance also map GITLAB_API_URL (e.g. https://gitlab.example.com/api/v4) under env.

- name: linear
  title: Linear
  description: Issues, projects, cycles and comments in Linear (Linear's hosted server).
  homepage: https://linear.app/docs/mcp
  tags: [issues, project-management]
  server:
    url: https://mcp.linear.app/mcp
    headers: {Authorization: "Bearer ${LINEAR_API_KEY}"}
  notes: Create a personal API key under Settings, Security & access, or add linear-oauth to sign in instead.

- name: linear-oauth
  title: Linear (OAuth)
  description: Issues, projects, cycles and comments in Linear, signing in with OAuth instead of an API key (Linear's hosted server).
  homepage: https://linear.app/docs/mcp
  tags: [issues, project-management]
  server:
    url: https://mcp.linear.app/mcp
    auth: oauth
  notes: Run habakkuk mcp login linear-oauth.

- name: notion-hosted
  title: Notion (hosted)
  description: Search, read and edit Notion pages and databases through Notion's hosted server, signing in with OAuth.
  homepage: https://developers.notion.com/docs/mcp
  tags: [docs, notes, wiki]
  server:
    url: https://mcp.notion.com/mcp
    auth: oauth
  notes: Run habakkuk mcp login notion-hosted and pick the pages to share.

- name: sentry-hosted
  title: Sentry (hosted)
  description: Issues, events, stack traces and releases through Sentry's hosted server, signing in with OAuth.
  homepage: https://docs.sentry.io/product/sentry-mcp/
  tags: [errors, monitoring]
  server:
    url: https://mcp.sentry.dev/mcp
    auth: oauth
  notes: Run habakkuk mcp login sentry-hosted.

- name: notion
  title: Notion
  description: Search, read and edit Notion pages and databases (Notion's own server).
  homepage: https://github.com/makenotion/notion-mcp-server
  tags: [docs, notes, wiki]
  needs: [npx]
  server:
    command: npx
    args: [-y, "@notionhq/notion-mcp-server"]
    env: {NOTION_TOKEN: NOTION_TOKEN}
  notes: Create an internal integration, use its secret as NOTION_TOKEN, and share the pages it may use with it.

- name: slack
  title: Slack
  description: Read channels and threads, post messages and reactions (MCP reference server, archived).
  homepage: https://www.npmjs.com/package/@modelcontextprotocol/server-slack
  tags: [chat, messaging]
  needs: [npx]
  server:
    command: npx
    args: [-y, "@modelcontextprotocol/server-slack"]
    env: {SLACK_BOT_TOKEN: SLACK_BOT_TOKEN, SLACK_TEAM_ID: SLACK_TEAM_ID}
    approve: [slack_post_message, slack_reply_to_thread]

- name: google-drive
  title: Google Drive
  description: Search and read files in Google Drive, exporting Docs and Sheets as text (MCP reference server, archived).
  homepage: https://www.npmjs.com/package/@modelcontextprotocol/server-gdrive
  tags: [files, docs]
  needs: [npx]
  server:
    command: npx
    args: [-y, "@modelcontextprotocol/server-gdrive"]
  notes: Needs a Google Cloud OAuth client and a one-time sign-in; follow the package README, then map the variables it names under env.

- name: stripe
  title: Stripe
  description: Customers, payments, invoices, subscriptions and Stripe docs search (Stripe's hosted server).
  homepage: https://docs.stripe.com/mcp
  tags: [payments, billing]
  server:
    url: https://mcp.stripe.com
    headers: {Authorization: "Bearer ${STRIPE_SECRET_KEY}"}
    risk: write
  notes: Use a restricted key with only the permissions Habakkuk needs, and a test-mode key while trying it.

- name: sentry
  title: Sentry
  description: Issues, events, stack traces and releases from Sentry (Sentry's own server).
  homepage: https://github.com/getsentry/sentry-mcp
  tags: [errors, monitoring]
  needs: [npx]
  server:
    command: npx
    args: [-y, "@sentry/mcp-server"]
    env: {SENTRY_ACCESS_TOKEN: SENTRY_ACCESS_TOKEN}
  notes: A user auth token with org:read, project:read and event:read is enough to read.

- name: supabase
  title: Supabase
  description: Tables, SQL, migrations, logs and edge functions of your Supabase projects (Supabase's own server).
  homepage: https://supabase.com/docs/guides/getting-started/mcp
  tags: [database, postgres, backend]
  needs: [npx]
  server:
    command: npx
    args: [-y, "@supabase/mcp-server-supabase@latest", --read-only]
    env: {SUPABASE_ACCESS_TOKEN: SUPABASE_ACCESS_TOKEN}
  notes: Read-only by default; remove --read-only in config.yaml to let it change things, and add --project-ref=<ref> to scope it to one project.

- name: postgres
  title: PostgreSQL
  description: Read-only SQL queries and schema inspection on a Postgres database (MCP reference server, archived).
  homepage: https://www.npmjs.com/package/@modelcontextprotocol/server-postgres
  tags: [database, sql]
  needs: [npx]
  server:
    command: sh
    args: [-c, 'exec npx -y @modelcontextprotocol/server-postgres "$POSTGRES_URL"']
    env: {POSTGRES_URL: POSTGRES_URL}
  notes: POSTGRES_URL is a connection string such as postgresql://user:pass@host:5432/db; prefer a read-only role.

- name: sqlite
  title: SQLite
  description: Query and change a local SQLite database (MCP reference server, archived).
  homepage: https://pypi.org/project/mcp-server-sqlite/
  tags: [database, sql]
  needs: [uvx]
  params: {db: path to the database file}
  server:
    command: uvx
    args: [mcp-server-sqlite, --db-path, "{db}"]
    risk: write

- name: filesystem
  title: Filesystem
  description: Read, write, move and search files inside one folder (MCP reference server).
  homepage: https://www.npmjs.com/package/@modelcontextprotocol/server-filesystem
  tags: [files]
  needs: [npx]
  params: {dir: the folder the server may use}
  server:
    command: npx
    args: [-y, "@modelcontextprotocol/server-filesystem", "{dir}"]
    risk: write

- name: fetch
  title: Fetch
  description: Fetch a web page and return it as Markdown (MCP reference server).
  homepage: https://pypi.org/project/mcp-server-fetch/
  tags: [web]
  needs: [uvx]
  server:
    command: uvx
    args: [mcp-server-fetch]

- name: git
  title: Git
  description: Status, diffs, logs, branches and commits in a local repository (MCP reference server).
  homepage: https://pypi.org/project/mcp-server-git/
  tags: [code, git]
  needs: [uvx]
  params: {repo: path to the repository}
  server:
    command: uvx
    args: [mcp-server-git, --repository, "{repo}"]
    risk: write

- name: memory
  title: Memory (knowledge graph)
  description: A local knowledge graph of entities, relations and observations (MCP reference server).
  homepage: https://www.npmjs.com/package/@modelcontextprotocol/server-memory
  tags: [memory]
  needs: [npx]
  server:
    command: npx
    args: [-y, "@modelcontextprotocol/server-memory"]
    risk: write

- name: sequential-thinking
  title: Sequential thinking
  description: A scratchpad tool for step-by-step problem solving (MCP reference server).
  homepage: https://www.npmjs.com/package/@modelcontextprotocol/server-sequential-thinking
  tags: [reasoning]
  needs: [npx]
  server:
    command: npx
    args: [-y, "@modelcontextprotocol/server-sequential-thinking"]
    risk: read

- name: time
  title: Time
  description: Current time and conversions between time zones (MCP reference server).
  homepage: https://pypi.org/project/mcp-server-time/
  tags: [time]
  needs: [uvx]
  server:
    command: uvx
    args: [mcp-server-time]
    risk: read

- name: everything
  title: Everything (test server)
  description: Exercises every MCP feature; useful to check that a client works (MCP reference server).
  homepage: https://www.npmjs.com/package/@modelcontextprotocol/server-everything
  tags: [testing]
  needs: [npx]
  server:
    command: npx
    args: [-y, "@modelcontextprotocol/server-everything"]
    risk: read

- name: brave-search
  title: Brave Search
  description: Web, news, image and local search through the Brave Search API (Brave's own server).
  homepage: https://github.com/brave/brave-search-mcp-server
  tags: [search, web]
  needs: [npx]
  server:
    command: npx
    args: [-y, "@brave/brave-search-mcp-server"]
    env: {BRAVE_API_KEY: BRAVE_API_KEY}

- name: exa
  title: Exa
  description: Neural web search and page contents through the Exa API (Exa's own server).
  homepage: https://github.com/exa-labs/exa-mcp-server
  tags: [search, web]
  needs: [npx]
  server:
    command: npx
    args: [-y, exa-mcp-server]
    env: {EXA_API_KEY: EXA_API_KEY}

- name: tavily
  title: Tavily
  description: Web search and extraction through the Tavily API (Tavily's own server).
  homepage: https://github.com/tavily-ai/tavily-mcp
  tags: [search, web]
  needs: [npx]
  server:
    command: npx
    args: [-y, tavily-mcp@latest]
    env: {TAVILY_API_KEY: TAVILY_API_KEY}

- name: firecrawl
  title: Firecrawl
  description: Scrape, crawl and extract structured data from websites (Firecrawl's own server).
  homepage: https://github.com/firecrawl/firecrawl-mcp-server
  tags: [web, scraping]
  needs: [npx]
  server:
    command: npx
    args: [-y, firecrawl-mcp]
    env: {FIRECRAWL_API_KEY: FIRECRAWL_API_KEY}

- name: context7
  title: Context7
  description: Up-to-date documentation and code examples for libraries (Upstash's server).
  homepage: https://github.com/upstash/context7
  tags: [docs, code]
  needs: [npx]
  server:
    command: npx
    args: [-y, "@upstash/context7-mcp"]
    risk: read

- name: playwright
  title: Playwright
  description: Drive a browser through accessibility snapshots (Microsoft's server).
  homepage: https://github.com/microsoft/playwright-mcp
  tags: [browser, web, testing]
  needs: [npx]
  server:
    command: npx
    args: [-y, "@playwright/mcp@latest"]
  notes: Habakkuk also has its own browser toolset (toolsets [browser]) that needs no Node.

- name: puppeteer
  title: Puppeteer
  description: Navigate, click, fill forms and take screenshots in Chrome (MCP reference server, archived).
  homepage: https://www.npmjs.com/package/@modelcontextprotocol/server-puppeteer
  tags: [browser, web]
  needs: [npx]
  server:
    command: npx
    args: [-y, "@modelcontextprotocol/server-puppeteer"]

- name: figma
  title: Figma (desktop)
  description: Design context, variables and screenshots of the selected frame, served by the Figma desktop app.
  tags: [design]
  server:
    url: http://127.0.0.1:3845/mcp
    risk: read
  notes: Turn on the MCP server in the Figma desktop app's preferences (Dev Mode); it listens only while the app runs.

- name: atlassian
  title: Atlassian (Jira, Confluence)
  description: Search and edit Jira issues and Confluence pages (Atlassian's hosted Rovo server, OAuth sign-in).
  homepage: https://support.atlassian.com/atlassian-rovo-mcp-server/
  tags: [issues, wiki, docs]
  server:
    url: https://mcp.atlassian.com/v1/mcp
    auth: oauth
  notes: Run habakkuk mcp login atlassian and approve the access for your site.

- name: cloudflare
  title: Cloudflare
  description: Workers, KV, R2, D1 and other account resources (Cloudflare's hosted bindings server, OAuth sign-in).
  homepage: https://github.com/cloudflare/mcp-server-cloudflare
  tags: [cloud, hosting]
  server:
    url: https://bindings.mcp.cloudflare.com/mcp
    auth: oauth
  notes: Run habakkuk mcp login cloudflare. Cloudflare runs other servers too (docs, observability); see the homepage.

- name: vercel
  title: Vercel
  description: Projects, deployments, logs and Vercel docs (Vercel's hosted server, OAuth sign-in).
  homepage: https://vercel.com/docs/mcp/vercel-mcp
  tags: [cloud, hosting, deploy]
  server:
    url: https://mcp.vercel.com
    auth: oauth
  notes: Run habakkuk mcp login vercel.

- name: railway
  title: Railway
  description: Projects, services, deployments, variables and logs on Railway (Railway's own server, using the Railway CLI's login).
  homepage: https://github.com/railwayapp/railway-mcp-server
  tags: [cloud, hosting, deploy]
  needs: [npx, railway]
  server:
    command: npx
    args: [-y, "@railway/mcp-server"]
  notes: Run `railway login` first; the server acts with that account.

- name: mongodb
  title: MongoDB
  description: Query collections and inspect schemas in MongoDB or Atlas (MongoDB's own server).
  homepage: https://github.com/mongodb-js/mongodb-mcp-server
  tags: [database]
  needs: [npx]
  server:
    command: npx
    args: [-y, mongodb-mcp-server, --readOnly]
    env: {MDB_MCP_CONNECTION_STRING: MDB_MCP_CONNECTION_STRING}

- name: hugging-face
  title: Hugging Face
  description: Search models, datasets, Spaces and papers on the Hugging Face Hub (Hugging Face's hosted server).
  homepage: https://huggingface.co/settings/mcp
  tags: [ml, models]
  server:
    url: https://huggingface.co/mcp
    headers: {Authorization: "Bearer ${HF_TOKEN}"}
    risk: read

- name: aws-docs
  title: AWS documentation
  description: Search and read the AWS documentation (AWS Labs server).
  homepage: https://github.com/awslabs/mcp
  tags: [docs, cloud]
  needs: [uvx]
  server:
    command: uvx
    args: [awslabs.aws-documentation-mcp-server@latest]
    risk: read

- name: google-maps
  title: Google Maps
  description: Geocoding, places, directions and distances (MCP reference server, archived).
  homepage: https://www.npmjs.com/package/@modelcontextprotocol/server-google-maps
  tags: [maps, places]
  needs: [npx]
  server:
    command: npx
    args: [-y, "@modelcontextprotocol/server-google-maps"]
    env: {GOOGLE_MAPS_API_KEY: GOOGLE_MAPS_API_KEY}
