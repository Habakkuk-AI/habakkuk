name: ci
on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes to the repository, and pull requests from forks run it.
permissions:
  contents: read

# Jobs run on Blacksmith's runners (blacksmith.sh), which take the same
# steps as GitHub's own images. Its cache applies to actions/setup-go.
jobs:
  test:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
      # Cross-compile checks: every release platform must build and vet.
      - run: GOOS=windows GOARCH=amd64 go vet ./...
      - run: GOOS=windows GOARCH=arm64 go build ./...
      - run: GOOS=darwin GOARCH=arm64 go build ./...
      # The installer lives at the root or in scripts/.
      - run: |
          for f in install.sh scripts/install.sh; do
            if [ -f "$f" ]; then sh -n "$f" && shellcheck "$f"; fi
          done
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  # Windows: build, vet and the full test suite. Tests that need Unix
  # (sh scripts, permission bits, process-group signals) skip themselves
  # with testutil.UnixOnly; `git grep -n testutil.UnixOnly` lists them.
  windows:
    runs-on: blacksmith-4vcpu-windows-2025
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      # install.ps1 parses and its helpers (the PATH list, whose hk it is)
      # behave, in both PowerShells people have.
      - name: install.ps1 tests
        shell: pwsh
        run: .\scripts\install_test.ps1
      - name: install.ps1 tests in Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\install_test.ps1

  # Habakkuk Desktop is its own module (CGO, a webview); ./... above skips it.
  desktop:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/desktop/go.mod
          cache-dependency-path: apps/desktop/go.sum
      - run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev
      - run: go vet ./...
        working-directory: apps/desktop
      - run: go test -race ./...
        working-directory: apps/desktop
      - run: sh -n apps/desktop/scripts/package.sh && shellcheck apps/desktop/scripts/package.sh
