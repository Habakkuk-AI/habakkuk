name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...

  # Static binaries for each platform, packed as habakkuk_<os>_<arch>.tar.gz
  # (the names scripts/install.sh and habakkuk update expect) or, for Windows,
  # habakkuk_windows_<arch>.zip holding habakkuk.exe (scripts/install.ps1),
  # plus SHA256SUMS, attached to a release. When the RELEASE_SIGNING_KEY
  # secret (an Ed25519 private key in PEM) is set, SHA256SUMS.sig is added
  # and binaries built with the RELEASE_PUBLIC_KEY variable (the raw public
  # key, base64) refuse unsigned or mis-signed updates.
  binaries:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        env:
          RELEASE_PUBLIC_KEY: ${{ vars.RELEASE_PUBLIC_KEY }}
        run: |
          set -eu
          mkdir -p dist
          date=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          ldflags="-s -w -X main.version=${TAG} -X main.commit=${GITHUB_SHA} -X main.date=${date}"
          if [ -n "${RELEASE_PUBLIC_KEY:-}" ]; then
            ldflags="$ldflags -X main.releaseKey=${RELEASE_PUBLIC_KEY}"
          fi
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${target%/*}
            arch=${target#*/}
            pkg="dist/habakkuk_${os}_${arch}"
            mkdir -p "$pkg"
            bin=habakkuk
            [ "$os" = windows ] && bin=habakkuk.exe
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "$ldflags" -o "$pkg/$bin" ./cmd/habakkuk
            cp LICENSE NOTICE README.md "$pkg/"
            if [ "$os" = windows ]; then
              (cd "$pkg" && zip -q -9 "../habakkuk_${os}_${arch}.zip" "$bin" LICENSE NOTICE README.md)
            else
              tar -C "$pkg" -czf "$pkg.tar.gz" "$bin" LICENSE NOTICE README.md
            fi
          done
          cd dist
          sha256sum habakkuk_*.tar.gz habakkuk_*.zip > SHA256SUMS
          cat SHA256SUMS
      - name: Sign
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          set -eu
          if [ -z "${RELEASE_SIGNING_KEY:-}" ]; then
            echo "RELEASE_SIGNING_KEY is not set; the release is checksummed but not signed"
            exit 0
          fi
          umask 077
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$RUNNER_TEMP/release-key.pem"
          openssl pkeyutl -sign -inkey "$RUNNER_TEMP/release-key.pem" -rawin -in dist/SHA256SUMS \
            | base64 -w0 > dist/SHA256SUMS.sig
          echo >> dist/SHA256SUMS.sig
          rm -f "$RUNNER_TEMP/release-key.pem"
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          pre=""
          case "$TAG" in *-*) pre="--prerelease" ;; esac
          files="dist/*.tar.gz dist/*.zip dist/SHA256SUMS"
          [ -f dist/SHA256SUMS.sig ] && files="$files dist/SHA256SUMS.sig"
          # shellcheck disable=SC2086
          gh release create "$TAG" $files \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "Habakkuk $TAG" $pre


  # Habakkuk Desktop (apps/desktop, Wails v3, a module of its own): a universal
  # Habakkuk.app as .zip and .dmg, a Windows .exe and a Linux tar.gz, attached
  # to the release the binaries job created. Unsigned; see docs/interfaces/desktop-app.md.
  desktop:
    needs: binaries
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: darwin
          - os: windows-latest
            target: windows
          - os: ubuntu-24.04
            target: linux
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/desktop/go.mod
          cache-dependency-path: apps/desktop/go.sum
      - name: Linux webview
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev
      - name: Test
        # The tests drive a fake habakkuk serve with signals; Windows only builds.
        if: matrix.target != 'windows'
        working-directory: apps/desktop
        run: go test ./...
      - name: Build
        run: VERSION="$TAG" apps/desktop/scripts/package.sh "${{ matrix.target }}"
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" apps/desktop/dist/Habakkuk-Desktop_* --repo "$GITHUB_REPOSITORY" --clobber

  # Multi-arch image on ghcr.io: <version> always, latest for non-prerelease
  # tags. The Go build cross-compiles; QEMU only runs the base image's apt.
  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Image tags
        id: tags
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tags="$image:${TAG#v}"
          case "$TAG" in *-*) ;; *) tags="$tags,$image:latest" ;; esac
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: VERSION=${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.licenses=Apache-2.0
