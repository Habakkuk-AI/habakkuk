version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      go:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /apps/desktop
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      desktop:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /apps/website
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      website:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
